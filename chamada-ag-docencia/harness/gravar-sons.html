<!doctype html>
<meta charset="utf-8">
<title>gravar sons</title>
<pre id="log">gravando…</pre>
<script type="module">
  // Grava cada som do app num OfflineAudioContext e envia o WAV para o servidor local.
  import { SONS, tocarSom } from '/src/lib/som.js'
  const SR = 44100, DURA = 2.2
  const log = t => { document.getElementById('log').textContent += '\n' + t }

  function wav(buf) {
    const d = buf.getChannelData(0), n = d.length
    const out = new DataView(new ArrayBuffer(44 + n * 2))
    const txt = (o, s) => [...s].forEach((ch, i) => out.setUint8(o + i, ch.charCodeAt(0)))
    txt(0, 'RIFF'); out.setUint32(4, 36 + n * 2, true); txt(8, 'WAVE'); txt(12, 'fmt ')
    out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true)
    out.setUint32(24, SR, true); out.setUint32(28, SR * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true)
    txt(36, 'data'); out.setUint32(40, n * 2, true)
    // corta o silêncio do fim
    let fim = n - 1; while (fim > 0 && Math.abs(d[fim]) < 0.0005) fim--
    for (let i = 0; i < n; i++) out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i])) * 32767, true)
    return new Blob([out.buffer.slice(0, 44 + (fim + 2205) * 2)], { type: 'audio/wav' })
  }

  const numero = { sino: 'A', brilho: 'B', missao: 'C', sinal: 'D', orbita: 'E', radar: 'F', carga: 'G' }
  const feitos = []
  for (const [k, nome] of SONS) {
    const c = new OfflineAudioContext(1, Math.ceil(SR * DURA), SR)
    tocarSom(c, k, c.destination, 0.02)
    const buf = await c.startRendering()
    let pico = 0; for (const v of buf.getChannelData(0)) pico = Math.max(pico, Math.abs(v))
    const arq = `${numero[k]} - ${nome}.wav`
    await fetch('http://127.0.0.1:8765/?nome=' + encodeURIComponent(arq), { method: 'POST', body: wav(buf) })
    feitos.push(`${arq} · pico ${pico.toFixed(2)}`)
    log(feitos[feitos.length - 1])
  }
  window.__feitos = feitos
</script>
